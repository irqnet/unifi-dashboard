# Podman Compose: local build & operation (no registry pull)
#   podman-compose up -d --build     or   podman compose up -d --build
name: unifi-dashboard

services:
  unifi-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/unifi-dashboard:latest
    container_name: unifi-dashboard
    restart: unless-stopped
    # Optional: .env next to compose.yaml. Stack managers (Portainer, Dockge, Komodo …) that
    # only set variables for interpolation work through the environment block.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data
      UNIFI_CONTROLLER_URL: ${UNIFI_CONTROLLER_URL:-}
      UNIFI_SITE_ID: ${UNIFI_SITE_ID:-default}
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      UNIFI_USERNAME: ${UNIFI_USERNAME:-}
      UNIFI_PASSWORD: ${UNIFI_PASSWORD:-}
      UNIFI_CONTROLLER_TYPE: ${UNIFI_CONTROLLER_TYPE:-auto}
      UNIFI_VERIFY_SSL: ${UNIFI_VERIFY_SSL:-false}
      UNIFI_MOCK: ${UNIFI_MOCK:-false}
      POLLING_INTERVAL_MS: ${POLLING_INTERVAL_MS:-5000}
      HISTORY_MINUTES: ${HISTORY_MINUTES:-30}
      WAN_BANDWIDTH_DOWN_MBPS: ${WAN_BANDWIDTH_DOWN_MBPS:-}
      WAN_BANDWIDTH_UP_MBPS: ${WAN_BANDWIDTH_UP_MBPS:-}
      VOUCHER_PRESETS: ${VOUCHER_PRESETS:-1440,1,,,;4320,1,,,;10080,3,,,}
      VOUCHER_WIFI_SSID: ${VOUCHER_WIFI_SSID:-}
      VOUCHER_WIFI_PASSWORD: ${VOUCHER_WIFI_PASSWORD:-}
      VOUCHER_NOTE_REQUIRED: ${VOUCHER_NOTE_REQUIRED:-false}
      VOUCHER_MAX_BATCH: ${VOUCHER_MAX_BATCH:-100}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      HIDE_SENSITIVE_IPS: ${HIDE_SENSITIVE_IPS:-true}
    ports:
      # external 3004 → internal 3000
      - "${HOST_PORT:-3004}:3000"
    volumes:
      # :Z = private SELinux label so the container may write.
      # DATA_PATH=unifi-dashboard-data uses the named volume below instead
      # (created automatically with the right permissions for UID 1000).
      - ${DATA_PATH:-./data}:/app/data:Z
    # Rootless Podman: set USERNS_MODE=keep-id:uid=1000,gid=1000 so the host user is
    # UID 1000 (node) in the container and ./data is writable without chown (Podman >= 4.3).
    # Empty (default) = normal behaviour, compatible with Docker.
    userns_mode: ${USERNS_MODE:-}
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Example: reach the controller by host name (UNIFI_CONTROLLER_URL=https://unifi.local)
    extra_hosts:
      - "unifi.local:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  unifi-dashboard-data:
